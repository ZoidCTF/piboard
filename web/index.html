<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>piboard</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preload" href="fonts/roboto-300.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/cormorant-garamond-600-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bg">
  <div class="photo" id="photoA"></div>
  <div class="photo" id="photoB"></div>
  <div class="scrim"></div>
  <div class="tint"></div>
  <div id="fog"></div>
  <div id="flash"></div>
</div>

<main id="board">
  <section id="left" class="panel">
    <h1 id="title"></h1>
    <div id="clock"><span id="hm"></span><span id="sec"></span></div>
    <div id="date"></div>
    <div id="weather">
      <div id="now"><span id="now-icon"></span><span id="now-temp"></span></div>
      <div id="forecast"></div>
    </div>
  </section>

  <section id="map" class="panel">
    <iframe id="map-frame" title="Wind map" tabindex="-1"></iframe>
    <div class="pin"></div>
    <div class="pin-label">Kelowna</div>
  </section>

  <section id="calendar" class="panel">
    <div id="cal-head"></div>
    <div id="cal-grid"></div>
  </section>

  <section id="strip" class="panel">
    <div id="hourly"></div>
    <div id="aqhi" class="tile"></div>
    <div id="sun" class="tile"></div>
  </section>

  <section id="cards" class="panel">
    <div id="notices" hidden></div>
    <div id="card-stage" class="card"></div>
    <div id="card-dots"></div>
  </section>
  <section id="fx" class="panel"></section>
  <section id="moon" class="panel"></section>
  <div id="credit"></div>
</main>

<canvas id="wx-canvas"></canvas>
<div id="night"></div>
<script src="moon.js"></script>
<script src="ambience.js"></script>
<script src="cards.js"></script>
<script src="app.js"></script>
</body>
</html>
